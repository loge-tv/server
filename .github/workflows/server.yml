name: server

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Both architectures of the image: Go fuses multiply-adds on arm64 and
    # not on amd64, so the fingerprint maths may differ in the last bits.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # compose.yaml as people run it, on real amd64 and arm64 (not emulation):
  # a generated season through a fake Plex, analysed 6 times on fresh volumes;
  # any crash fails it (see e2e/run.sh).
  compose:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sepia-server:e2e .
      - run: e2e/run.sh 6

  image:
    needs: [test, compose]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Go cross-compiles on the runner (FROM --platform=$BUILDPLATFORM); QEMU
      # runs only the amd64 stage's apk add.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # sepia-server is the new name; loge-server gets the same builds for now.
          images: |
            ghcr.io/${{ github.repository_owner }}/sepia-server
            ghcr.io/${{ github.repository_owner }}/loge-server
          tags: |
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
